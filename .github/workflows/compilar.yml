name: Compilar Compresor OCR PRO
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Compilar
        run: pyinstaller --noconfirm --clean --onedir --windowed --name CompresorOCRPRO --paths . --hidden-import src.app --hidden-import src.processor --hidden-import src.ocr --hidden-import src.parser main.py
      - name: Comprimir
        shell: pwsh
        run: Compress-Archive -Path dist/CompresorOCRPRO/* -DestinationPath CompresorOCRPRO-Windows.zip
      - uses: actions/upload-artifact@v4
        with:
          name: CompresorOCRPRO-Windows
          path: CompresorOCRPRO-Windows.zip
